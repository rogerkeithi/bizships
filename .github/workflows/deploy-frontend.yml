name: Deploy frontend

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "IMAGE_NAME=n0jiri/bizships-frontend-production" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_API_URL=${{ secrets.PRODUCTION_NEXT_PUBLIC_API_URL }}" >> $GITHUB_ENV
          else
            echo "IMAGE_NAME=n0jiri/bizships-frontend-staging" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_API_URL=${{ secrets.STAGING_NEXT_PUBLIC_API_URL }}" >> $GITHUB_ENV
          fi

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: |
          docker build --no-cache \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            -t $IMAGE_NAME:latest \
            -f ./frontend/Dockerfile \
            ./frontend

      - name: Push image
        run: |
          docker push $IMAGE_NAME:latest
